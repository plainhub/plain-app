name: Release to Discord

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement
        shell: bash
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          : "${RELEASE_WEBHOOK_URL:?Configure the RELEASE_WEBHOOK_URL secret}"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            release=$(jq -ce '.release' "$GITHUB_EVENT_PATH")
          else
            release=$(curl --fail --silent --show-error --max-time 30 \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")
          fi
          jq -ce '{
            username: "Release",
            avatar_url: "https://cdn.discordapp.com/icons/1109007781337505823/39f69a2c514e3d448db625017213698d.webp?size=160",
            content: "||@everyone||",
            allowed_mentions: {parse: ["everyone"]},
            embeds: [{
              title: (("📦 New Release: " + (.name // .tag_name))[:256]),
              url: .html_url,
              description: ((.body // "No changelog provided." | gsub("\r"; ""))[:4000]),
              color: 2105893,
              footer: {text: "Changelog", icon_url: "https://cdn.discordapp.com/icons/1109007781337505823/39f69a2c514e3d448db625017213698d.webp?size=160"},
              timestamp: .published_at
            }]
          }' <<< "$release" |
            curl --fail --silent --show-error --max-time 30 --proto '=https' --json @- "$RELEASE_WEBHOOK_URL"
