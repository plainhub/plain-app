name: Release

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify APKs without uploading to R2, scanning, drafting a release, or publishing to Play
        type: boolean
        default: false
      draft_only:
        description: Create a GitHub draft without uploading to Play or R2
        type: boolean
        default: false

permissions:
  contents: read   # jobs that need more declare it at job level

jobs:
  apk:
    uses: ./.github/workflows/build-apk-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

  # Builds the googleRelease AAB and uploads it straight to the Play Store
  # internal track. The AAB is Play-Store-only: it never becomes a GitHub
  # release asset. Runs in parallel with the apk job on a separate runner.
  play:
    if: ${{ !inputs.verify_only && !inputs.draft_only }}
    name: Build AAB and publish to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - run: chmod +x ./gradlew

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ./app/release.jks

      # build-aab.sh patches the manifest (strips Play-restricted permissions),
      # builds the AAB, and writes play-config.json for the publisher.
      - name: Build AAB and publish to Play Store
        run: bash build-aab.sh && ./gradlew publishGoogleReleaseBundle

      # Kept as an internal artifact only (for Play Console deobfuscation);
      # it is not attached to the GitHub release.
      - name: Save mapping.txt (googleRelease)
        run: cp app/build/outputs/mapping/googleRelease/mapping.txt mapping-google-release.txt

      - name: Upload Play mapping artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-google-release
          path: mapping-google-release.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ !inputs.verify_only }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance

      - name: Create GitHub Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$refs" && "$(printf '%s\n' "$refs" | sort -k2 | tail -n1 | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag points to a different commit." >&2
            exit 1
          fi
          {
            cat <<'NOTES'
          ## What's Changed

          ## Security

          ### Build provenance
          Download an installer and `release-provenance.jsonl` and verify with the GitHub CLI:
          ```sh
          NOTES
            printf '%s\n' "gh attestation verify PlainApp-$VERSION-64bit-Recommended.apk \\" \
              "  --repo $GITHUB_REPOSITORY \\" \
              "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build-apk-release.yml \\" \
              "  --source-digest $GITHUB_SHA --signer-digest $GITHUB_SHA \\" \
              "  --bundle release-provenance.jsonl"
            cat <<'NOTES'
          ```

          > VirusTotal scans are running; the results table is appended here automatically. <!-- VT-PENDING -->
          NOTES
          } > release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Release $VERSION" --notes-file release-notes.md -- \
            "PlainApp-$VERSION-64bit-Recommended.apk" "PlainApp-$VERSION-Old-32bit.apk" \
            release-provenance.jsonl release-manifest.txt release-manifest.sig mapping-github-release.txt

  # Scans both release APKs concurrently and appends the VirusTotal table to
  # the release body once done. The AAB is not scanned: it is only
  # distributed via Play Store.
  virustotal:
    name: VirusTotal scan (async)
    needs: [apk, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edits the release body to append the scan table
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - name: Scan with VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          upload_and_poll() {
            local file="$1" outprefix="$2"
            local sha256 size_bytes upload_url analysis_id last_response poll_status
            local malicious suspicious undetected harmless total detected result_status
            sha256=$(sha256sum "$file" | awk '{print $1}')
            size_bytes=$(stat -c%s "$file")
            upload_url="https://www.virustotal.com/api/v3/files"
            if [ "$size_bytes" -gt 33554432 ]; then
              upload_url=$(curl -sS --request GET \
                --url https://www.virustotal.com/api/v3/files/upload_url \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
              if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
                printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
                printf '%s' "⬜ N/A" > "${outprefix}.status"
                return
              fi
            fi
            analysis_id=$(curl -sS --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" | jq -r '.data.id')
            if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
              printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
              printf '%s' "⬜ N/A" > "${outprefix}.status"
              return
            fi
            last_response=""
            for i in $(seq 1 30); do
              sleep 20
              last_response=$(curl -sS \
                --url "https://www.virustotal.com/api/v3/analyses/$analysis_id" \
                --header "x-apikey: $VT_API_KEY")
              poll_status=$(echo "$last_response" | jq -r '.data.attributes.status')
              [ "$poll_status" = "completed" ] && break
            done
            malicious=$(echo  "$last_response" | jq -r '.data.attributes.stats.malicious   // 0')
            suspicious=$(echo "$last_response" | jq -r '.data.attributes.stats.suspicious  // 0')
            undetected=$(echo "$last_response" | jq -r '.data.attributes.stats.undetected  // 0')
            harmless=$(echo   "$last_response" | jq -r '.data.attributes.stats.harmless    // 0')
            total=$((malicious + suspicious + undetected + harmless))
            detected=$((malicious + suspicious))
            [ "$detected" -eq 0 ] \
              && result_status="✅ ${detected}/${total} Clean" \
              || result_status="⚠️ ${detected}/${total} Detected"
            printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
            printf '%s' "$result_status" > "${outprefix}.status"
          }
          upload_and_poll "PlainApp-${VERSION}-64bit-Recommended.apk" /tmp/vt_default &
          upload_and_poll "PlainApp-${VERSION}-Old-32bit.apk"         /tmp/vt_armv7   &
          wait
          {
            echo "default_report=$(cat /tmp/vt_default.url)"
            echo "default_status=$(cat /tmp/vt_default.status)"
            echo "armv7_report=$(cat /tmp/vt_armv7.url)"
            echo "armv7_status=$(cat /tmp/vt_armv7.status)"
          } >> $GITHUB_OUTPUT

      - name: Append scan results to the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          gh release view "v${VERSION}" --json body -q .body > body.md
          # Replace the "scans running" placeholder with the results table.
          sed -i '/VT-PENDING/d' body.md
          {
            cat body.md
            echo ''
            echo '### VirusTotal Scan'
            echo '| File | Status | Scan Report |'
            echo '|------|--------|-------------|'
            echo "| \`PlainApp-${VERSION}-64bit-Recommended.apk\` | ${{ steps.scan.outputs.default_status }} | [View Report](${{ steps.scan.outputs.default_report }}) |"
            echo "| \`PlainApp-${VERSION}-Old-32bit.apk\` | ${{ steps.scan.outputs.armv7_status }} | [View Report](${{ steps.scan.outputs.armv7_report }}) |"
          } > new-body.md
          gh release edit "v${VERSION}" --notes-file new-body.md

  r2-upload:
    name: Upload verified installers to Cloudflare R2
    if: ${{ !inputs.verify_only && !inputs.draft_only }}
    needs: apk
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance

      - name: Upload verified installers to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Configure R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Configure R2_SECRET_ACCESS_KEY}"
          : "${AWS_ENDPOINT_URL_S3:?Configure R2_ENDPOINT_URL}"
          : "${R2_BUCKET:?Configure R2_BUCKET}"
          dest="s3://$R2_BUCKET/${R2_PREFIX:+${R2_PREFIX%/}/}"
          aws s3 cp "PlainApp-$VERSION-64bit-Recommended.apk" "$dest" --cache-control "public, max-age=31536000, immutable"
          for file in release-manifest.txt release-manifest.sig; do
            aws s3 cp "$file" "${dest}v$VERSION/" --cache-control "public, max-age=31536000, immutable"
          done
