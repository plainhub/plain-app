name: UI policy and host tests
on:
  pull_request:
    paths: ['tests/**', 'plain-common/**', 'shared/src/**', 'app/src/**', 'app/build.gradle.kts', 'shared/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'ui-check/**', 'scripts/check-ui.sh', 'scripts/ui-component-baseline.tsv', '.github/workflows/ui-policy.yml', 'gradle/**', 'plain-rs/Cargo.toml', 'plain-rs/Cargo.lock', 'rust-toolchain.toml']
  push:
    branches: [main]
    paths: ['tests/**', 'plain-common/**', 'shared/src/**', 'app/src/**', 'app/build.gradle.kts', 'shared/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'ui-check/**', 'scripts/check-ui.sh', 'scripts/ui-component-baseline.tsv', '.github/workflows/ui-policy.yml', 'gradle/**', 'plain-rs/Cargo.toml', 'plain-rs/Cargo.lock', 'rust-toolchain.toml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Check runner Android SDK
        run: test -d "${ANDROID_HOME:?}/licenses"
      - run: ./gradlew :shared:checkAppFeatureParity
      - run: bash scripts/check-ui.sh
      - run: ./gradlew :plain-common:testAndroidHostTest :shared:testAndroidHostTest
