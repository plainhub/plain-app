[package]
name = "plain-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "plain_rust"
crate-type = ["cdylib", "staticlib"]

[dependencies]
plain-rs = { git = "https://github.com/plainhub/plain-desktop.git", rev = "526a319f046e0e6a3f1d1a7fa3fa68886d3f19b0", features = ["content_api"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
