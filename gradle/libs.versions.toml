navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtimeVersion" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "uiVersion" }
